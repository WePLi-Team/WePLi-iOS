name: WePLi CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lint: ${{ steps.filter.outputs.lint }}
      labels: ${{ steps.filter.outputs.labels }}
      automation: ${{ steps.filter.outputs.automation }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - 'Projects/**'
              - 'Tuist/**'
              - 'Configs/**'
              - 'scripts/**'
              - '**/Package.resolved'
              - '**/Tuist/Dependencies.lock'
              - '**/*.xcodeproj'
              - '**/*.xcworkspace'
            lint:
              - '.github/workflows/ci.yml'
              - 'Projects/**/*.swift'
              - '.swiftlint.yml'
              - '.swiftformat'
            labels:
              - '.github/labels.yml'
            automation:
              - '.claude/**'

  automation:
    name: Automation Scripts (.claude)
    needs: changes
    if: ${{ needs.changes.outputs.automation == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify automation scripts
        run: sh .claude/skills/finish-feature/scripts/verify.sh claude

  labels:
    name: Sync Labels
    needs: changes
    if: ${{ needs.changes.outputs.labels == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Apply labels from config
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: false

  lint:
    name: Lint (SwiftFormat & SwiftLint)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    # SwiftFormat · SwiftLint 모두 Linux 바이너리가 있어 macOS 러너를 기다리지 않는다
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Swift files
        id: has_swift
        run: |
          if git ls-files '*.swift' | grep -q .; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Install lint tools (pinned in .mise.toml)
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        uses: jdx/mise-action@v4
        with:
          install_args: swiftformat swiftlint

      - name: Tool versions
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint mode)
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        run: |
          echo "Running SwiftFormat in lint mode…"
          swiftformat --lint . --config .swiftformat

      - name: SwiftLint (strict, no cache)
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        run: |
          echo "Running SwiftLint…"
          swiftlint --strict --quiet --no-cache --reporter github-actions-logging

      - name: Skip Lint (no Swift files)
        if: ${{ steps.has_swift.outputs.present != 'true' }}
        run: echo "No Swift files in repo yet. Skipping lint."

  build-test:
    name: Build & Unit Test
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_VERSION: '26.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Tuist Dependencies
        uses: actions/cache@v5
        with:
          path: Tuist/.build
          key: ${{ runner.os }}-tuist-build-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-build-

      # 의존성(swift-syntax · TCA 등) 빌드 결과를 재사용한다. 앱 소스는 checkout마다 새로 컴파일된다
      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: DerivedData
          key: ${{ runner.os }}-dd-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'Tuist/ProjectDescriptionHelpers/**', 'Projects/**/Project.swift') }}
          restore-keys: |
            ${{ runner.os }}-dd-xcode${{ env.XCODE_VERSION }}-

      # 새 러너는 시뮬레이터 첫 부팅이 오래 걸려, Tuist 설치 · 생성과 겹치도록 먼저 백그라운드로 부팅한다
      - name: Pick & Boot Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found"; exit 1
          fi
          echo "SIM_ID=$SIM_ID" >> $GITHUB_OUTPUT
          nohup xcrun simctl bootstatus "$SIM_ID" -b > simulator-boot.log 2>&1 &

      # 빌드에는 tuist만 쓴다(ruby · swiftformat · swiftlint는 설치하지 않는다).
      # macos-26 러너는 캐시 조회만 2–3분 걸려, tuist 하나는 캐시 없이 바로 받는다
      - name: Setup mise (Tuist via mise)
        uses: jdx/mise-action@v4
        with:
          install_args: tuist
          cache: false

      - name: Tuist version
        run: tuist version

      # SwiftGen 생성물은 커밋돼 있어 CI에서 설치하지 않는다(brew 설치만 약 2분)
      - name: Setup utilities
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Tuist Install (resolve deps)
        run: tuist install

      - name: Tuist Generate
        run: tuist generate --no-open

      # 커버리지 · 인덱스는 CI에서 쓰지 않아 끈다. clean 없이 캐시된 DerivedData 위에서 빌드한다
      - name: Build & Test
        env:
          SIM_ID: ${{ steps.sim.outputs.SIM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace WePLi.xcworkspace \
            -scheme WePLi \
            -destination "id=$SIM_ID" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage NO \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 \
            | tee >(perl -MPOSIX -pe 'BEGIN { $| = 1 } print strftime("%H:%M:%S ", localtime)' > xcodebuild.log) \
            | xcbeautify

      - name: Trim DerivedData before cache save
        if: ${{ always() }}
        run: rm -rf DerivedData/Logs DerivedData/Index.noindex

      # 원본 로그(줄마다 시각)를 남긴다 — xcbeautify 출력에 보이지 않는 대기 구간을 확인할 때 쓴다
      - name: Upload Xcode Build Log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore