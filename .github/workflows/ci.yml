name: WePLi CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lint: ${{ steps.filter.outputs.lint }}
      labels: ${{ steps.filter.outputs.labels }}
      automation: ${{ steps.filter.outputs.automation }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - 'Projects/**'
              - 'Tuist/**'
              - 'Configs/**'
              - 'scripts/**'
              - '**/Package.resolved'
              - '**/Tuist/Dependencies.lock'
              - '**/*.xcodeproj'
              - '**/*.xcworkspace'
            lint:
              - '.github/workflows/ci.yml'
              - 'Projects/**/*.swift'
              - '.swiftlint.yml'
              - '.swiftformat'
            labels:
              - '.github/labels.yml'
            automation:
              - '.claude/**'

  automation:
    name: Automation Scripts (.claude)
    needs: changes
    if: ${{ needs.changes.outputs.automation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify automation scripts
        run: sh .claude/skills/finish-feature/scripts/verify.sh claude

  labels:
    name: Sync Labels
    needs: changes
    if: ${{ needs.changes.outputs.labels == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply labels from config
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: false

  lint:
    name: Lint (SwiftFormat & SwiftLint)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Swift files
        id: has_swift
        run: |
          if git ls-files '*.swift' | grep -q .; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Install lint tools (pinned in .mise.toml)
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        uses: jdx/mise-action@v3
        with:
          install_args: swiftformat swiftlint

      - name: Tool versions
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        run: |
          swiftformat --version
          swiftlint version

      - name: SwiftFormat (lint mode)
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        run: |
          echo "Running SwiftFormat in lint mode…"
          swiftformat --lint . --config .swiftformat

      - name: SwiftLint (strict, no cache)
        if: ${{ steps.has_swift.outputs.present == 'true' }}
        run: |
          echo "Running SwiftLint…"
          swiftlint --strict --quiet --no-cache --reporter github-actions-logging

      - name: Skip Lint (no Swift files)
        if: ${{ steps.has_swift.outputs.present != 'true' }}
        run: echo "No Swift files in repo yet. Skipping lint."

  build-test:
    name: Build & Unit Test
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Tuist/Dependencies.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Tuist Dependencies
        uses: actions/cache@v5
        with:
          path: Tuist/Dependencies
          key: ${{ runner.os }}-tuist-${{ hashFiles('**/Tuist/Dependencies.lock') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Setup mise (Tuist via mise)
        uses: jdx/mise-action@v3

      - name: Install tools via mise
        run: |
          mise install
          tuist version

      - name: Setup utilities
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          for tool in swiftgen xcbeautify; do
            command -v "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          swiftgen --version

      - name: Tuist Install (resolve deps)
        run: tuist install

      - name: Tuist Generate
        run: tuist generate --no-open

      - name: Pick & Boot Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found"; exit 1
          fi
          echo "SIM_ID=$SIM_ID" >> $GITHUB_OUTPUT
          xcrun simctl boot "$SIM_ID" || true

      - name: Build & Test
        env:
          SIM_ID: ${{ steps.sim.outputs.SIM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace WePLi.xcworkspace \
            -scheme WePLi \
            -destination "id=$SIM_ID" \
            -enableCodeCoverage YES \
            clean test | tee xcodebuild.log | xcbeautify

      - name: Upload Xcode Build Log on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore